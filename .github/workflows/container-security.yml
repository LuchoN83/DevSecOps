ntainer security · YML
name: container-security-pipeline
 
on:
  push:
    branches: [main, develop]
    paths:
      - 'container-security-observability/**'
      - '.github/workflows/container-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'container-security-observability/**'
 
env:
  REGISTRY:   ${{ secrets.ACR_NAME }}.azurecr.io
  IMAGE_NAME: demo-api
  COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
 
jobs:
  # ── 1. SAST ─────────────────────────────────────────────────────────────────
  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
 
      # semgrep-action v1 deprecó generateSarif; usar CLI directamente
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/nodejs
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
 
      # Alternativa sin token: semgrep CLI con output SARIF
      - name: Run Semgrep CLI (SARIF output)
        if: ${{ !secrets.SEMGREP_APP_TOKEN }}
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --error || true
 
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
 
  # ── 2. Build + Scan + Sign ───────────────────────────────────────────────────
  build-scan-sign:
    name: Build · Scan · Sign
    runs-on: ubuntu-latest
    needs: sast
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag:    ${{ steps.meta.outputs.version }}
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Login ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username:     ${{ secrets.ACR_CLIENT_ID }}
          password:     ${{ secrets.ACR_CLIENT_SECRET }}
 
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: container-security-observability
          push: ${{ github.event_name != 'pull_request' }}
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
          sbom:       true
 
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image:        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          output-file:  sbom.spdx.json
          format:       spdx-json
 
      - name: Scan SBOM / imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format:       sarif
          output:       trivy-results.sarif
          severity:     CRITICAL,HIGH
          exit-code:    '1'          # falla el pipeline si hay CRITICAL/HIGH
 
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
 
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
 
      - name: Sign image with Cosign (keyless OIDC)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
 
      - name: Attach SBOM as attestation
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
 
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
 
  # ── 3. Deploy DEV (GitOps vía ArgoCD) ───────────────────────────────────────
  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: build-scan-sign
    if: github.ref == 'refs/heads/develop'
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
 
      - name: Update image tag in dev overlay
        run: |
          sed -i "s|newTag:.*|newTag: sha-${{ github.sha }}|" \
            container-security-observability/k8s/overlays/dev/kustomization.yaml
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add container-security-observability/k8s/overlays/dev/kustomization.yaml
          git commit -m "chore(dev): bump image to sha-${{ github.sha }}" || true
          git push
 
  # ── 4. Deploy PRD (tag semver en main) ───────────────────────────────────────
  deploy-prd:
    name: Deploy PRD
    runs-on: ubuntu-latest
    needs: build-scan-sign
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
 
      - name: Update image tag in prd overlay
        run: |
          sed -i "s|newTag:.*|newTag: sha-${{ github.sha }}|" \
            container-security-observability/k8s/overlays/prd/kustomization.yaml
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git add container-security-observability/k8s/overlays/prd/kustomization.yaml
          git commit -m "chore(prd): bump image to sha-${{ github.sha }}" || true
          git push
