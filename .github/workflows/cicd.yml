name: CI-CD Secure (Trivy + Helm)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/secure-app
  IMAGE_TAG: ${{ github.sha }}
  K8S_NAMESPACE: apps

jobs:
  build_scan_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # si luego subes SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for build-time tasks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Trivy FS: vulnerabilidades + secretos + misconfig de Docker/Helm ---
      - name: Trivy FS scan (vuln+config+secret) - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: "vuln,secret,misconfig"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      # --- Build local para escaneo de imagen ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local) for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Trivy Image: falla con HIGH/CRITICAL ---
      - name: Trivy Image scan - fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          format: 'table'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # --- Login GHCR y push ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_scan_push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Write kubeconfig from secret
        run: |
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl version --client
          kubectl cluster-info

      - name: Create namespace if not exists
        run: |
          kubectl get ns ${{ env.K8S_NAMESPACE }} || kubectl create ns ${{ env.K8S_NAMESPACE }}

      - name: Helm Lint + DryRun render
        run: |
          helm lint helm/secure-app
          helm template secure-app helm/secure-app \
            --set image.repository=${{ env.IMAGE_REPO }} \
            --set image.tag=${{ needs.build_scan_push.outputs.image_tag || env.IMAGE_TAG }} \
            --namespace ${{ env.K8S_NAMESPACE }} >/dev/null

      - name: Helm Upgrade/Install (atomic + wait)
        run: |
          helm upgrade --install secure-app helm/secure-app \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository=${{ env.IMAGE_REPO }} \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --atomic --timeout 5m

      - name: Wait for rollout
        run: |
          kubectl rollout status deploy/secure-app -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

      - name: Helm tests
        run: helm test secure-app -n ${{ env.K8S_NAMESPACE }}
