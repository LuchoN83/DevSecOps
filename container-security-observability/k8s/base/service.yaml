---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api-sa
  labels:
    app.kubernetes.io/name: demo-api
automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  labels:
    app.kubernetes.io/name:      demo-api
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "3000"
spec:
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name:       http
      port:       80
      targetPort: http
      protocol:   TCP
  type: ClusterIP
