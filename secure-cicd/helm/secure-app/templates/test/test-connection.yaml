apiVersion: v1
kind: Pod
metadata:
  name: "secure-app-test"
  labels:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl
      securityContext:            # <-- añadir
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c", "curl -sSf http://secure-app:80/health | grep -q 'ok'"]
